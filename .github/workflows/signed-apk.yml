name: Signed Family Edition APK

# Trusted branch pushes only. pull_request builds never see the private signing key.
on:
  push:
    branches:
      - main
      - feature/family-dynamic-wallpapers
    paths:
      - 'launcher/**'
      - '.github/workflows/signed-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-family-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-launcher:
    name: Test, build and sign stable APK
    if: github.repository == 'tinx88/cleanyourtv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore privately stored signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILY_EDITION_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILY_EDITION_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::Configure FAMILY_EDITION_KEYSTORE_BASE64 and FAMILY_EDITION_KEYSTORE_PASSWORD in GitHub Actions secrets. See docs/family-signing.md.'
            exit 1
          fi
          path="$RUNNER_TEMP/family-edition-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          keytool -list -storetype PKCS12 -keystore "$path" -storepass "$KEYSTORE_PASSWORD" -alias family-edition >/dev/null
          echo "FAMILY_EDITION_SIGNING_KEYSTORE=$path" >> "$GITHUB_ENV"

      - name: Unit tests, lint, stable signed APK
        working-directory: launcher
        env:
          FAMILY_EDITION_SIGNING_PASSWORD: ${{ secrets.FAMILY_EDITION_KEYSTORE_PASSWORD }}
          FAMILY_EDITION_REQUIRE_STABLE_SIGNING: 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --min-sdk-version 26 --verbose --print-certs "$apk" \
            | tee "$RUNNER_TEMP/apk-signature-report.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-signature-report.txt"
          size=$(stat -c %s "$apk")
          echo "Signed APK: $((size / 1024)) KB"
          test "$size" -lt 524288 || { echo '::error::Family Edition APK exceeds 512 KB'; exit 1; }

      - name: Upload stable signed Family Edition APK
        uses: actions/upload-artifact@v4
        with:
          name: family-edition-signed-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
