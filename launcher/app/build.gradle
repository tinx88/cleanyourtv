plugins {
    id 'com.android.application'
}

// GitHub Actions uses an owner-held PKCS#12 key for installable releases.
// Ordinary PR/CI previews keep the runner's disposable debug key.
def familySigningStore = System.getenv('FAMILY_EDITION_SIGNING_KEYSTORE')
def familySigningPassword = System.getenv('FAMILY_EDITION_SIGNING_PASSWORD')
def stableSigningReady = familySigningStore && familySigningPassword
if (System.getenv('FAMILY_EDITION_REQUIRE_STABLE_SIGNING') == 'true' && !stableSigningReady) {
    throw new GradleException('Stable Family Edition signing requested but keystore/password are missing.')
}

android {
    signingConfigs {
        if (stableSigningReady) {
            familyEdition {
                storeFile file(familySigningStore)
                storePassword familySigningPassword
                keyAlias 'family-edition'
                keyPassword familySigningPassword
                storeType 'PKCS12'
            }
        }
    }

    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.5'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Owner-held key for installable releases; disposable debug key for preview/testing only.
            signingConfig stableSigningReady ? signingConfigs.familyEdition : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
